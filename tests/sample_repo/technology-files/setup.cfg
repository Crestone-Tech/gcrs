[metadata]
name = sample-project
version = 1.0.0
description = Sample project for testing

[options]
packages = find:
python_requires = >=3.8
install_requires =
    requests>=2.25.0
    flask>=2.0.0

[options.packages.find]
where = src

[flake8]
max-line-length = 100
exclude = .git,__pycache__,build,dist

