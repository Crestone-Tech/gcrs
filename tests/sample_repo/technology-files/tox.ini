[tox]
envlist = py38,py39,py310,py311
isolated_build = true

[testenv]
deps =
    pytest>=6.0.0
    pytest-cov>=2.0.0
commands =
    pytest --cov=src --cov-report=html --cov-report=term

[testenv:lint]
deps =
    flake8>=3.8.0
    black>=21.0.0
commands =
    flake8 src tests
    black --check src tests

