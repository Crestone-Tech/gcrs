---
- name: Deploy application
  hosts: webservers
  become: yes
  tasks:
    - name: Install dependencies
      apt:
        name:
          - python3
          - python3-pip
        state: present
    
    - name: Copy application files
      copy:
        src: ./app
        dest: /opt/app
    
    - name: Start application
      systemd:
        name: app
        state: started
        enabled: yes

